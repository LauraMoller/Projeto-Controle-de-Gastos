<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <title>New Transaction</title>
</head>
<body>
<div class="container mt-4">
    <h1>New Transaction</h1>
    <form th:action="@{/transactions}" th:object="${transaction}" method="post">
        <div class="mb-3">
            <label class="form-label" for="description">Description</label>
            <input th:field="*{description}" type="text" class="form-control" id="description" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="amount">Amount</label>
            <input th:field="*{amount}" type="number" step="0.01" class="form-control" id="amount" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="date">Date</label>
            <input th:field="*{date}" type="date" class="form-control" id="date" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="type">Type</label>
            <select th:field="*{type}" class="form-select" id="type" required>
                <option value="INCOME">Income</option>
                <option value="EXPENSE">Expense</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label" for="category">Category</label>
            <input th:field="*{category}" type="text" class="form-control" id="category" required>
        </div>

        <button type="submit" class="btn btn-primary">Save</button>
    </form>
</div>

<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
</body>
</html>
